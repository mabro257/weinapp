# Einmaliger Import des großen Weinkatalogs (X-Wines, 100.646 Weine) in Supabase.
# Nur per Knopfdruck: Actions -> Katalog-Import -> Run workflow.
# Voraussetzung: supabase/02_glossar.sql und 04_update_suche.sql wurden im SQL Editor ausgeführt.
name: Katalog-Import

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien aus dem Repository holen
        uses: actions/checkout@v5

      - name: PostgreSQL-Werkzeuge installieren
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-common postgresql-client

      - name: Katalog importieren
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DB_URL" || { echo "Secret SUPABASE_DB_URL fehlt"; exit 1; }
          gunzip -k data/katalog.csv.gz
          wc -l data/katalog.csv
          # Alles in einer Transaktion: bei einem Fehler bleibt die Datenbank unverändert
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/05_katalog_import.sql
